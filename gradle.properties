# ⚠️ 不要在这里写 org.gradle.java.home=/绝对路径。
# 本机 JDK 装在 ~/app/jdk21，但仓库是公开的：把本机绝对路径提交进来会让
# CI（GitHub Actions）直接失败：
#   Value '/home/cloudea/app/jdk21' given for org.gradle.java.home Gradle property is invalid
# 正确的做法是两边各自解决：
#   · 本机：~/.gradle/gradle.properties 里写 org.gradle.java.installations.paths=<jdk 目录>
#   · CI：actions/setup-java 提供 JDK 21，由 jvmToolchain(21) 自动解析
# 本地命令行仍是：JAVA_HOME=~/app/jdk21 ./gradlew <task>

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.daemon.jvmargs=-Xmx2g
kotlin.incremental=true
