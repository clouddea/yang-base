name: Bug report / 缺陷报告
description: 报告可复现的行为异常（不是安全问题）
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把「最小复现」写清楚 —— 没有复现路径的 issue 很难推进。

        ⚠️ **安全问题请勿在此提交**，见 [SECURITY.md](../blob/main/SECURITY.md)。

  - type: input
    id: version
    attributes:
      label: 版本 / commit
      description: 运行 `git rev-parse --short HEAD`，或填写 release 版本号
      placeholder: "例如 0.1.0-SNAPSHOT @ ac57b27"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: 对象存储后端
      description: 问题发生在哪个后端上？如果多个后端都能复现，选「多个」
      options:
        - 本地文件系统（--fs / --i-know-this-is-not-durable）
        - MinIO
        - AWS S3
        - 阿里云 OSS
        - 腾讯云 COS
        - 其它 / 未确定
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 发生了什么？期望发生什么？
      placeholder: |
        期望：
        实际：
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 建表 + 插入 + 触发问题的最小 SQL，以及启动参数
      render: sql
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误输出
      description: 服务端日志、异常栈、客户端报错。**请先去掉密钥与业务数据**
      render: shell

  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统、JDK 版本、客户端（mysql CLI / JDBC / DataGrip）、是否单 CN
      placeholder: "Ubuntu 24.04 / JDK 21 / JDBC 8.x / 单 CN"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已在最新 main 分支上确认问题仍然存在
          required: true
        - label: 我已阅读 docs/compatibility.md，确认这不是已知的不支持项
          required: true
