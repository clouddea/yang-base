name: Feature request / 功能建议
description: 提出新能力、兼容性缺口或使用体验改进
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先搜一下已有 issue，也请看一眼 [docs/zh/compatibility.md](../blob/main/docs/zh/compatibility.md) ——
        有些能力是**明确不做**的（例如本年度不做认证/权限/TLS），提前确认能省双方时间。

  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - SQL 语法 / 语义缺口
        - 对象存储后端接入
        - 性能 / 成本优化
        - 运维工具（yb-cli / 可观测性）
        - 协议兼容（MySQL / PostgreSQL）
        - 文档 / 示例
        - 其它
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 尽量描述场景，而不是直接给方案 —— 场景能让我们判断更合适的做法
      placeholder: "我在做 X 的时候，因为 Y 导致做不到 Z"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的做法
      description: 如果有参考实现（MySQL / PostgreSQL / 其它数据库的行为），请写出来

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 例如：为什么用现有能力凑不出来

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
